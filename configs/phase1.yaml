# Étude du rapport : 2 000 pistes de FMA small, EnCodec 24 kHz à 6 et 12 kbit/s (+ codec identité).
#   musicdetect manifest   -c configs/phase1.yaml
#   musicdetect build-fma  -c configs/phase1.yaml --codec encodec_24k_6kbps --codec encodec_24k_12kbps \
#                          --codec identity_24k
# Stockage : 2 000 pistes x 2 segments x 320 Ko = 1,3 Go par source.
# Les valeurs non listées viennent de src/musicdetect/default.yaml.
fma:
  subset: small
  split_mode: artist
  max_tracks: 2000
audio:
  segments_per_track: 2
eval:
  bootstrap: 1000
  fpr_target: 0.01
